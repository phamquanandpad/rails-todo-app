purge_soft_deleted_records:
  cron: "0 3 * * *"
  class: "PurgeSoftDeletedRecordsJob"
  active_job: true
  queue: low
  description: "Archive and hard-delete records soft-deleted >= 30 days ago"

start_estimated_todos:
  cron: "5 0 * * *"
  class: "StartEstimatedTodosJob"
  active_job: true
  queue: low
  description: "Transition pending todos to in_progress when estimateStart hits today"

remind_overdue_todos:
  cron: "0 11 * * *"
  class: "RemindOverdueTodosJob"
  active_job: true
  queue: low
  description: "Notify owners of active todos whose estimateEnd is today or past"
