name: CI/CD Sidekiq Deploy Docker to Render

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Đăng nhập vào Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build và Push Docker Image (Sidekiq)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/todo-app-sidekiq:latest

    - name: Kích hoạt Deploy Sidekiq trên Render
      run: curl -X POST ${{ secrets.RENDER_SIDEKIQ_DEPLOY_HOOK }}
