parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer

get:
  summary: Get current user
  operationId: get-user
  tags: [user]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: User found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'

patch:
  summary: Update current user
  operationId: patch-user
  tags: [user]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            username:
              type: string
            email:
              type: string
              format: email
            password:
              type: string
              format: password
            password_confirmation:
              type: string
              format: password
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    '422':
      $ref: '#/components/responses/UnprocessableEntity'
    '401':
      $ref: '#/components/responses/Unauthorized'

delete:
  summary: Delete current user (soft delete)
  operationId: delete-user
  tags: [user]
  security:
    - bearerAuth: []
  responses:
    '204':
      description: User deleted
    '401':
      $ref: '#/components/responses/Unauthorized'
