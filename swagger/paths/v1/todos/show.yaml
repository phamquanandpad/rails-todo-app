parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer

get:
  summary: Get a todo
  operationId: get-todo
  tags: [todo]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Todo found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Todo'
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'

patch:
  summary: Update a todo
  operationId: patch-todo
  tags: [todo]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            task:
              type: string
            description:
              type: string
              nullable: true
            status:
              type: string
              enum: [pending, in_progress, completed]
            estimateStartAt:
              type: string
              format: date
              nullable: true
            estimateEndAt:
              type: string
              format: date
              nullable: true
  responses:
    '200':
      description: Todo updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Todo'
    '422':
      $ref: '#/components/responses/UnprocessableEntity'
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'

delete:
  summary: Delete a todo (soft delete)
  operationId: delete-todo
  tags: [todo]
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Todo deleted
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'
