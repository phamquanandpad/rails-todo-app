post:
  summary: Refresh access token
  operationId: post-auth-refresh
  tags: [auth]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            refreshToken:
              type: string
          required: [refreshToken]
  responses:
    '200':
      description: Tokens refreshed
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
              refreshToken:
                type: string
    '401':
      $ref: '#/components/responses/Unauthorized'
