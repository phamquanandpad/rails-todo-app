get:
  summary: Get current user profile and permissions
  operationId: get-auth-me
  tags: [auth]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Current user profile with permission list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeResponse'
    '401':
      $ref: '#/components/responses/Unauthorized'
