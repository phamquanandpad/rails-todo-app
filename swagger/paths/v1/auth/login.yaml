post:
  summary: Login
  description: >
    Authenticates the user and returns a short-lived access token in the
    response body. A long-lived refresh token is set as an HttpOnly signed
    cookie (`refresh_token`) and is **not** included in the response body.
  operationId: post-auth-login
  tags: [auth]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              format: email
              example: john@example.com
            password:
              type: string
              format: password
              example: secret123
          required: [email, password]
  responses:
    '200':
      description: Login successful. Refresh token set as HttpOnly cookie.
      content:
        application/json:
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  username:
                    type: string
                  email:
                    type: string
              accessToken:
                type: string
    '401':
      $ref: '#/components/responses/Unauthorized'
