parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer

get:
  summary: Get a permission
  operationId: get-permission
  tags: [permission]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Permission found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Permission'
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

patch:
  summary: Update a permission
  operationId: patch-permission
  tags: [permission]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              type: string
              nullable: true
            roles:
              type: array
              items:
                type: string
                enum: [admin, member]
              description: "Grant/revoke permission for all users of each role"
  responses:
    '200':
      description: Permission updated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Permission'
    '422':
      $ref: '#/components/responses/UnprocessableEntity'
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

delete:
  summary: Delete a permission
  operationId: delete-permission
  tags: [permission]
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Permission deleted
    '422':
      $ref: '#/components/responses/UnprocessableEntity'
    '404':
      $ref: '#/components/responses/NotFound'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
