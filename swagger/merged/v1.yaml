openapi: 3.0.1
info:
  title: Todo API
  version: v1
  description: Rails 7.2 API-only todo management system
servers:
  - url: http://localhost:3000
    description: Development
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: post-auth-register
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: john_doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: secret123
                password_confirmation:
                  type: string
                  format: password
                  example: secret123
              required:
                - username
                - email
                - password
                - password_confirmation
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  email:
                    type: string
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/auth/login:
    post:
      summary: Login
      description: >
        Authenticates the user and returns a short-lived access token in the
        response body. A long-lived refresh token is set as an HttpOnly signed
        cookie (`refresh_token`) and is **not** included in the response body.
      operationId: post-auth-login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: secret123
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful. Refresh token set as HttpOnly cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                      email:
                        type: string
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: >
        Exchange a refresh token for a new access token. The refresh token can
        be supplied either as the `refreshToken` body field **or** via the
        `refresh_token` HttpOnly signed cookie set by `/auth/login`. The new
        refresh token is always returned as an HttpOnly cookie; it is **not**
        included in the response body.
      operationId: post-auth-refresh
      tags:
        - auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional if the HttpOnly refresh_token cookie is present.
      responses:
        '200':
          description: Token refreshed. New refresh token set as HttpOnly cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    delete:
      summary: Logout
      description: >
        Revokes the refresh token and clears the `refresh_token` HttpOnly
        cookie. The token can be supplied as the `refreshToken` body field
        **or** read automatically from the cookie.
      operationId: delete-auth-logout
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional if the HttpOnly refresh_token cookie is present.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/todos:
    get:
      summary: List todos
      operationId: get-todos
      tags:
        - todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/overdue'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Todos listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a todo
      operationId: post-todos
      tags:
        - todo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: string
                  example: Buy groceries
                description:
                  type: string
                  nullable: true
                  example: Milk, eggs, bread
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - completed
                  example: pending
                estimateStartAt:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-06-11'
                estimateEndAt:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-06-15'
              required:
                - task
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/todos/deleted:
    get:
      summary: List restorable (soft-deleted) todos
      description: >-
        Returns the current user's todos that are soft-deleted but have not yet
        been purged into the archive table. These are the todos that can be
        restored via `PATCH /api/v1/todos/{id}/restore`.
      operationId: get-todos-deleted
      tags:
        - todo
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Deleted todos listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a todo
      operationId: get-todo
      tags:
        - todo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a todo
      operationId: patch-todo
      tags:
        - todo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: string
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - completed
                estimateStartAt:
                  type: string
                  format: date
                  nullable: true
                estimateEndAt:
                  type: string
                  format: date
                  nullable: true
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a todo (soft delete)
      operationId: delete-todo
      tags:
        - todo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Todo deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/todos/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Restore a soft-deleted todo
      description: >-
        Restores a todo that is currently soft-deleted and still present in the
        `todos` table, clearing its `deletedAt`. Todos that have already been
        purged into the archive table cannot be restored and return `404`.
      operationId: patch-todo-restore
      tags:
        - todo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todo restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get current user
      operationId: get-user
      tags:
        - user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update current user
      operationId: patch-user
      tags:
        - user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete current user (soft delete)
      operationId: delete-user
      tags:
        - user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications:
    get:
      summary: List notifications
      operationId: get-notifications
      tags:
        - notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Notifications listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/read_all:
    post:
      summary: Mark all notifications as read
      operationId: post-notifications-read-all
      tags:
        - notification
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All notifications marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/{id}/read:
    patch:
      summary: Mark a notification as read
      operationId: patch-notification-read
      tags:
        - notification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Notification marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Todo:
      title: Todo
      type: object
      properties:
        id:
          type: integer
        task:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
        userId:
          type: integer
        estimateStartAt:
          type: string
          format: date
          nullable: true
          example: '2026-06-11'
        estimateEndAt:
          type: string
          format: date
          nullable: true
          example: '2026-06-15'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - task
        - status
        - userId
        - createdAt
        - updatedAt
    User:
      title: User
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - role
        - createdAt
        - updatedAt
    Notification:
      title: Notification
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
          description: Client-side route to navigate to when notification is clicked
          example: /todos/42
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - read
        - createdAt
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
  parameters:
    page:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        default: 1
    limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        default: 20
    status:
      name: status
      in: query
      description: Filter by todo status
      schema:
        type: string
        enum:
          - pending
          - in_progress
          - completed
    overdue:
      name: overdue
      in: query
      description: >-
        When true, only return active non-completed todos with estimateEndAt <=
        today.
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string
