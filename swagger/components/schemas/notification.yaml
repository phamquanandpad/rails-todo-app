components:
  schemas:
    Notification:
      title: Notification
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
          description: Client-side route to navigate to when notification is clicked
          example: /todos/42
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, title, read, createdAt]
