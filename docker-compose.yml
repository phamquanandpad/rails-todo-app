services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DATABASE_NAME:-todo_app_development}
    ports:
      - "${DATABASE_PORT:-33066}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql2://root@db/todo_app_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/rails

  swagger-merger:
    build:
      context: ./swagger
    working_dir: /swagger
    volumes:
      - ./swagger:/swagger

  swagger:
    image: redocly/redoc
    volumes:
      - ./swagger:/usr/share/nginx/html/swagger
    environment:
      SPEC_URL: swagger/merged/v1.yaml
    ports:
      - "8031:80"
    depends_on:
      - swagger-merger

volumes:
  mysql_data:
  redis_data:
